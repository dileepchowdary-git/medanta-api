    # Medanta Patna report API (medanta-report-api.service, port 8003).
    # Paste inside the "listen 443 ssl" server block of
    # /etc/nginx/sites-available/aae-auto-agent.5cn.co.in
    location ^~ /api/medanta/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
